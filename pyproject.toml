[project]
name = "banking-kata"
version = "0.1.0"
description = ""
authors = [
    {name = "Siraj Alam",email = "sirajalam049@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "python-dateutil (>=4.0.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=html -s --log-cli-level=INFO"
pythonpath = "."

[tool.coverage.html]
directory = "htmlcov"
